name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - trivy

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v3

      - name: Connexion à Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build de l'image Docker
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/html5up-forty:latest .

      - name: Push de l'image sur Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/html5up-forty:latest

  scan-trivy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout du code
        uses: actions/checkout@v3

      - name: Scanner l'image avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/html5up-forty:latest
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH

  deploy:
    runs-on: ubuntu-latest
    needs: scan-trivy
    steps:
      - name: Déploiement
        run: echo "Image validée et déployée avec succès !"